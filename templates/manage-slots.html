<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Manage Slots | DMS</title>
		<script src="/static/js/tailwind.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
		<link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
		<style>
			::-webkit-scrollbar {
				width: 8px;
			}
			::-webkit-scrollbar-track {
				background: #f1f1f1;
			}
			::-webkit-scrollbar-thumb {
				background: #888;
			}
			::-webkit-scrollbar-thumb:hover {
				background: #555;
			}
			input.gridjs-input{
				box-shadow: 0 0 0 1px #141414;
			}
			input.gridjs-input:focus {
				border-color: #615FFF;
				box-shadow: 0 0 0 3px #615FFF80;
			}
			.gridjs-search-input{
				width: 100%;
			}
			.gridjs-wrapper {
				overflow-x: auto;
			}
			.gridjs-table {
				min-width: 600px;
			}
			@media (max-width: 768px) {
				.gridjs-table {
					font-size: 0.875rem;
				}
				.gridjs-th {
					padding: 8px 4px !important;
				}
				.gridjs-td {
					padding: 8px 4px !important;
				}
			}
               .loader {
                    border: 16px solid #f3f3f3;
                    border-radius: 50%;
                    border-top: 16px solid #615FFF;
                    width: 120px;
                    height: 120px;
                    -webkit-animation: spin 2s linear infinite; /* Safari */
                    animation: spin 2s linear infinite;
               }

               /* Safari */
               @-webkit-keyframes spin {
                    0% { -webkit-transform: rotate(0deg); }
                    100% { -webkit-transform: rotate(360deg); }
               }

               @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
               }

			.date-input-wrapper {
				position: absolute !important;
				right: 310px !important;
				top: 8px !important;
				z-index: 50;
			}

			/* .gridjs-search {
				margin-right: 200px !important;
			} */
		</style>
	</head>
	<body>
		<section class="flex min-h-screen">
			{% include 'navbar.html' %}
			<div class="p-4 sm:p-6 lg:p-8 w-full lg:w-[calc(100vw-18rem)] lg:ml-[18rem] mt-16 lg:mt-0">
				<div class="w-full flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
					<h1 class="text-2xl sm:text-3xl font-bold">Daily Schedule</h1>
				</div>
				<div class="my-5 pb-5 flex flex-col gap-5 bg-white rounded-xl shadow-[3px_8px_20px_-10px_#00000015]">
					<div class="w-full relative">
						<div class="date-input-wrapper absolute top-2 w-48 z-50">
							<input type="date" class="block w-full rounded-lg bg-white px-[13px] py-[10px] text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
						</div>
						<div id="daily-time-slots" class="w-full"></div>
					</div>
				</div>
			</div>
		</section>
          <section class="fixed top-0 left-0 w-full h-full bg-black/80 flex justify-center items-center z-50 transition-all duration-300 hidden" id="loader-modal">
               <div class="loader"></div>
          </section>
		<script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
		<script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
          <!-- <script src="//mozilla.github.io/pdf.js/build/pdf.mjs" type="module"></script> -->
		<script>
			let currentGrid = null;
			function updateDateRight() {
				const dateWrapper = document.querySelector('.date-input-wrapper');
				const searchInput = document.querySelector(".gridjs-search-input");
				if (dateWrapper && searchInput) {
					dateWrapper.style.right = `${searchInput.offsetWidth + 16}px`;
				}
			}

               function showLoader() {
                    document.getElementById("loader-modal").classList.remove('hidden');
                    document.getElementById("loader-modal").classList.add('flex');
                    document.getElementsByTagName("body")[0].style.overflow = "hidden";
               }

               function hideLoader() {
                    document.getElementById("loader-modal").classList.add('hidden');
                    document.getElementById("loader-modal").classList.remove('flex');
                    document.getElementsByTagName("body")[0].style.overflow = "visible";
               }

			function handleDateChange(event) {
    const selectedDate = event.target.value;
    const container = document.getElementById('daily-time-slots');
    showLoader();
    
    // Initialize new grid with the selected date
    initializeDailyTimeSlotsGrid(selectedDate).then(grid => {
        // Clear previous grid if exists
        if (currentGrid) {
            currentGrid.destroy();
        }
        // Store and render new grid
        currentGrid = grid;
        container.innerHTML = '';
        currentGrid.render(container);
        hideLoader();
    });
}

			document.querySelector('input[type="date"]').addEventListener('change', handleDateChange);

			// Function to initialize the grid with dynamic columns
			async function initializeDailyTimeSlotsGrid(date = null) {
				try {
					// First fetch the data to get vehicle names
					const url = date 
						? `/getSlotWiseData/?date=${date}`
						: '/getSlotWiseData/';
					
					const response = await fetch(url);
					const data = await response.json();
					
					// Get unique vehicle names for columns
					const vehicleNames = [...new Set(data["data"].map(vehicle => vehicle.vehicleName))];
					
					// Create the grid with dynamic columns
					const dailyTimeSlotsGrid = new gridjs.Grid({
						search: true,
						// pagination: {
						// 	limit: 5,
						// 	summary: false
						// },
						sort: true,
						fixedHeader: true,
						columns: ["Daily Schedule", ...vehicleNames],
						data: () => {
							// Transform the data to group by slot time
							const slotMap = new Map();
							
							// Process each vehicle's slots
							data["data"].forEach(vehicle => {
								vehicle.slots.forEach(slot => {
									if (!slotMap.has(slot.slotTime)) {
										slotMap.set(slot.slotTime, {
											slotTime: slot.slotTime,
											vehicleData: {}
										});
									}
									
									// Add vehicle info to this slot
									slotMap.get(slot.slotTime).vehicleData[vehicle.vehicleName] = {
										student: slot.student,
										branch: slot.branch,
										attendanceStatus: slot.attendanceStatus
									};
								});
							});
							
							// Convert to grid format
							return Array.from(slotMap.values()).map(slotData => {
								const row = [slotData.slotTime];
								
								// Add data for each vehicle column
								vehicleNames.forEach(vehicleName => {
									const vehicleInfo = slotData.vehicleData[vehicleName];
									if (vehicleInfo) {
										// Parse slot time and compare with current time
										const timeRange = slotData.slotTime.split(' - ')[0]; // Get start time
										const [hours, minutes] = timeRange.split(':'); // Parse HH:mm:ss format
										const slotDateTime = new Date();
										slotDateTime.setHours(parseInt(hours), parseInt(minutes), 0);
										const currentTime = new Date();

										let cellContent = vehicleInfo.student || '--';
										let cellStyle = '';

										if (vehicleInfo.student && slotDateTime < currentTime) {
											if (vehicleInfo.attendanceStatus === 'NotMarked') {
												cellStyle = 'color: red;';
												cellContent = `${vehicleInfo.student} (${vehicleInfo.attendanceStatus})`;
											} else if (vehicleInfo.attendanceStatus) {
												cellStyle = 'color: green;';
												cellContent = `${vehicleInfo.student} (${vehicleInfo.attendanceStatus})`;
											}
										}

										row.push(gridjs.html(
										`<div style="${cellStyle}">${cellContent}</div>`
										));
									} else {
										row.push('Slot Not Available');
									}
								});
								
								return row;
							});
						},
						className: {
							th: '!bg-black !text-white',
							sort: '!bg-black !text-white',
							search: '!float-right !w-[25%]',
						}
					});

					updateDateRight();
					
					return dailyTimeSlotsGrid;
					
				} catch (error) {
					console.error('Error initializing grid:', error);
					
					// Fallback grid with static columns
					return new gridjs.Grid({
						search: true,
						sort: true,
						fixedHeader: true,
						columns: ["Slot", "Error loading vehicles"],
						data: [["Error", "Could not load data"]],
						className: {
							th: '!bg-black !text-white',
							sort: '!bg-black !text-white',
							search: '!float-right !w-[25%]',
						}
					});
				}
			}

			// Initialize and render the grid
			initializeDailyTimeSlotsGrid().then(grid => {
				grid.render(document.getElementById('daily-time-slots'));
			});

			// Or with async/await
			async function setupGrid() {
				const container = document.getElementById('daily-time-slots');
				currentGrid = await initializeDailyTimeSlotsGrid();
				container.innerHTML = '';
				currentGrid.render(container);
				setTimeout(updateDateRight, 100);
			}

			window.addEventListener('DOMContentLoaded', setupGrid);
			window.addEventListener('resize', updateDateRight);
			window.addEventListener('load', updateDateRight);

			// document.querySelector(".gridjs-search-input").placeholder = "Search...";
		</script>
	</body>
</html>
