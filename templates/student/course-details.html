	<script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
     <script>
          const courseContentGrid = new gridjs.Grid({
               search: true,
               pagination: {
                    limit: 5,
                    summary: false
               },
               sort: true,
               fixedHeader: true,
               columns: [{
                         id: "id",
                         name: "ID",
                         width: '5%',
                         formatter: (cell, row) => {
                              cell = `<span class="text-indigo-600 font-semibold">${cell}</span>`;
                              return gridjs.html(cell);
                         },
                         hidden: true
                    },
                    "Cource Content Description",
                    {
                         name:"Cource Content File",
                         formatter: (cell, row) => {
                              if (cell === null || cell === "") {
                                   return gridjs.html(`<p class="text-red-600">No PDF Found</p>`);
                              }
                              return gridjs.html(`<a href="${cell}" target="_blank" class="text-blue-600 underline">View PDF</a>`);
                         }
                    },
                    {
                         name:"Cource Content Video",
                         formatter: (cell, row) => {
                              if (cell === null || cell === "") {
                                   return gridjs.html(`<p class="text-red-600">No Video Found</p>`);
                              }
                              return gridjs.html(`<video class="w-full h-1/2 aspect-video" controls>
                                   <source src="${cell}" type="video/mp4">
                                   Your browser does not support the video tag.
                              </video>`);
                         }

               server: {
                    url: '/getcourceContentData/',
                    then: data => {
                         if (data.status === "success") {
                              return data["data"].map(courseContent => [courseContent.id, courseContent.courceContentDescription, courseContent.courcecontentFile, courseContent.courceContentVideo])
                         } else {
                              document.querySelector(".gridjs-tbody").innerHTML = `
                                   <tr class="gridjs-tr"><td role="alert" colspan="4" class="gridjs-td gridjs-message gridjs-error">No Data Found</td></tr>

                              return [];
