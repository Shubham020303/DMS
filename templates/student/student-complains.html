<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Manage Complains | DMS</title>
	<script src="/static/js/tailwind.js"></script>
	<link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
	<style>
		::-webkit-scrollbar {
			width: 8px;
		}

		::-webkit-scrollbar-track {
			background: #f1f1f1;
		}

		::-webkit-scrollbar-thumb {
			background: #888;
		}

		::-webkit-scrollbar-thumb:hover {
			background: #555;
		}

		input.gridjs-input {
			box-shadow: 0 0 0 1px #141414;
		}

		input.gridjs-input:focus {
			border-color: #615FFF;
			box-shadow: 0 0 0 3px #615FFF80;
		}

		.gridjs-search-input {
			width: 100%;
		}
		.gridjs-wrapper {
			overflow-x: auto;
		}
		.gridjs-table {
			min-width: 600px;
		}
		@media (max-width: 768px) {
			.gridjs-table {
				font-size: 0.875rem;
			}
			.gridjs-th {
				padding: 8px 4px !important;
			}
			.gridjs-td {
				padding: 8px 4px !important;
			}
		}
	</style>
</head>

<body>
	<section class="flex min-h-screen bg-indigo-50">
		{% include 'student/studentnavbar.html' %}
		<div class="p-4 sm:p-6 lg:p-8 w-full lg:w-[calc(100vw-18rem)] lg:ml-[18rem] mt-16 lg:mt-0">
			<div class="w-full flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-0">
				<h1 class="text-2xl sm:text-3xl font-bold">Manage Complains</h1>
				<div class="bg-indigo-500 text-white px-4 py-2 rounded cursor-pointer" id="add-complain">
					<p>Add Complain</p>
				</div>
			</div>
			<div id="wrapper" class="w-full mt-8"></div>
		</div>
	</section>
	<section
		class="fixed top-0 left-0 w-full h-full bg-black/80 flex justify-center items-center scale-0 opacity-0 z-50 transition-all duration-300 p-4"
		id="add-complain-modal">
		<div class="bg-white p-4 sm:p-6 lg:p-8 rounded-lg w-full sm:w-[90%] md:w-[80%] lg:w-[70%] xl:w-1/2 flex flex-col gap-4 sm:gap-6 max-h-[90vh] overflow-y-auto">
			<div class="flex justify-between items-center">
				<h1 id="complain-model-heading" class="text-xl sm:text-2xl lg:text-3xl font-bold">Add Complain</h1>
				<div class="bg-[#141414] flex items-center justify-center p-2 text-white rounded-full cursor-pointer"
					id="close-complain-modal">
					<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
						class="bi bi-x-lg" viewBox="0 0 16 16">
						<path
							d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
					</svg>
				</div>
			</div>
			<form action="" method="POST" class="w-full flex flex-col gap-6 max-h-[500px] overflow-y-auto pr-2"
				enctype="multipart/form-data" id="add-complain-form">
				{%csrf_token%}
				<div class="w-full">
					<div class="mb-4 flex flex-col sm:flex-row items-stretch gap-4 w-full">
						<div class="flex flex-col gap-2 w-full sm:w-1/2">
							<label for="complain" class="block font-semibold text-sm sm:text-base">Complain</label>
							<input type="text" name="complain" id="complain" autocomplete="off" required
								class="block w-full rounded-lg bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
						</div>
						<div class="flex flex-col gap-2 w-full sm:w-1/2">
							<label for="complainfor" class="block font-semibold text-sm sm:text-base">Complain For</label>
							<input type="text" name="complainfor" id="complainfor" autocomplete="off" required
								class="block w-full rounded-lg bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
						</div>
					</div>
					<div class="mb-4 w-full">
						<div class="flex flex-col gap-2 w-full">
							<label for="complainDescription" class="block font-semibold text-sm sm:text-base">Complain
								Description</label>
							<textarea rows="5" name="complainDescription" id="complainDescription"
								autocomplete="off" required
								class="block w-full rounded-lg bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"></textarea>
						</div>
					</div>
				</div>
				<div id="btns-container" class="flex flex-col sm:flex-row justify-end gap-2 sm:gap-0">
					<button id="add-complain-btn"
						class="bg-indigo-600 text-white px-4 sm:px-6 py-2 rounded cursor-pointer sm:mr-2 text-sm sm:text-base">
						<p>Add</p>
					</button>
					<botton id="close-add-complain-modal"
						class="bg-red-700 text-white px-4 py-2 rounded cursor-pointer text-sm sm:text-base">
						<p>Cancel</p>
					</botton>
				</div>
			</form>
		</div>
	</section>
	<section
		class="fixed top-0 left-0 w-full h-full bg-black/80 flex justify-center items-center scale-0 opacity-0 z-50 transition-all duration-300 p-4"
		id="resolved-complain-modal">
		<div class="bg-white p-4 sm:p-6 lg:p-8 rounded-lg w-full sm:w-[90%] md:w-[80%] lg:w-[70%] xl:w-1/2 flex flex-col gap-4 sm:gap-6 max-h-[90vh] overflow-y-auto">
			<div class="flex justify-between items-center">
				<h1 id="resolved-complain-heading" class="text-2xl font-bold">Resolve Complain</h1>
				<div class="bg-[#141414] flex items-center justify-center p-2 text-white rounded-full cursor-pointer"
					id="close-resolved-complain-btn">
					<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
						class="bi bi-x-lg" viewBox="0 0 16 16">
						<path
							d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z" />
					</svg>
				</div>
			</div>
			<div class="flex flex-col gap-2">
				<p id="resolved-complain-message">Complain resolved successfully.</p>
			</div>
			<div class="flex justify-end">
				<botton id="close-resolve-complain-modal"
					class="bg-indigo-600 text-white px-4 py-2 rounded cursor-pointer">
					<p>Close</p>
				</botton>
			</div>
		</div>
	</section>
	<section
    class="fixed top-0 left-0 w-full h-full bg-black/80 flex justify-center items-center scale-0 opacity-0 z-50 transition-all duration-300 p-4"
    id="view-complain-modal">
    <div class="bg-white p-4 sm:p-6 lg:p-8 rounded-lg w-full sm:w-[90%] md:w-[80%] lg:w-[70%] xl:w-1/2 flex flex-col gap-4 sm:gap-6 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Complaint Details</h1>
            <div class="bg-[#141414] flex items-center justify-center p-2 text-white rounded-full cursor-pointer hover:bg-gray-800 transition-colors"
                id="close-view-complain-modal">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                    class="bi bi-x-lg" viewBox="0 0 16 16">
                    <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
                </svg>
            </div>
        </div>
        <div class="flex flex-col gap-6">
            <!-- Status Badge -->
            <div class="flex justify-end">
                <span id="complaint-status" class="px-4 py-1.5 rounded-full text-sm font-semibold"></span>
            </div>
            
            <!-- Complaint Title -->
            <div class="border-b border-gray-200 pb-4">
                <h2 id="complaint-title" class="text-xl sm:text-2xl font-semibold text-gray-900"></h2>
                <p id="complaint-date" class="text-sm text-gray-500 mt-1"></p>
            </div>

            <!-- Complaint Description -->
            <div class="bg-gray-50 rounded-lg p-4">
                <h3 class="text-sm font-medium text-gray-500 mb-2">Description</h3>
                <p id="complaint-description" class="text-gray-700 whitespace-pre-wrap"></p>
            </div>

            <!-- Resolution Details (only shown if resolved) -->
            <div id="resolution-details" class="hidden flex flex-col gap-4 bg-green-50 rounded-lg p-4">
			  <div>
				  <h3 class="text-sm font-medium text-gray-500 mb-2">Action Taken</h3>
				  <p id="action-taken" class="text-gray-700 whitespace-pre-wrap"></p>
				</div>
				<div>
					<h3 class="text-sm font-medium text-gray-500 mb-2">Resolved By</h3>
					<p id="resolved-by" class="text-gray-700"></p>
				</div>
				<div>
		   <h3 class="text-sm font-medium text-gray-500 mb-2">Resolved On</h3>
		   <p id="resolved-date" class="text-gray-700"></p>
	    </div>
            </div>
        </div>
    </div>
</section>
	<script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
	<script>
		document.getElementById('add-complain').addEventListener('click', () => {
			document.getElementById('add-complain-modal').classList.remove('scale-0', 'opacity-0');
			document.getElementById('add-complain-modal').classList.add('scale-100', 'opacity-100');
			document.getElementById("complain-model-heading").innerText = "Add Complain";
			document.getElementById("btns-container").style.display = "flex";
			document.getElementById("add-complain-btn").innerText = "Add";
			document.getElementById('add-complain-modal').querySelector('form').reset();
			document.getElementById('add-complain-modal').querySelectorAll('input').forEach(input => {
				input.removeAttribute('readonly');
				input.removeAttribute('disabled');
				input.setAttribute('required', true);
				input.classList.add('focus:outline-2', 'focus:-outline-offset-2', 'focus:outline-indigo-600');
			});
		});

		document.getElementById('close-add-complain-modal').addEventListener('click', () => {
			document.getElementById('add-complain-modal').classList.remove('scale-100', 'opacity-100');
			document.getElementById('add-complain-modal').classList.add('scale-0', 'opacity-0');
		});

		document.getElementById('close-complain-modal').addEventListener('click', () => {
			document.getElementById('add-complain-modal').classList.remove('scale-100', 'opacity-100');
			document.getElementById('add-complain-modal').classList.add('scale-0', 'opacity-0');
		});

		document.getElementById('close-resolved-complain-btn').addEventListener('click', () => {
			document.getElementById('resolved-complain-modal').classList.remove('scale-100', 'opacity-100');
			document.getElementById('resolved-complain-modal').classList.add('scale-0', 'opacity-0');
			window.location.reload()
		});

		document.getElementById('close-resolve-complain-modal').addEventListener('click', () => {
			document.getElementById('resolved-complain-modal').classList.remove('scale-100', 'opacity-100');
			document.getElementById('resolved-complain-modal').classList.add('scale-0', 'opacity-0');
			window.location.reload()
		});

		document.getElementById('close-view-complain-modal').addEventListener('click', () => {
			document.getElementById('view-complain-modal').classList.remove('scale-100', 'opacity-100');
			document.getElementById('view-complain-modal').classList.add('scale-0', 'opacity-0');
			// window.location.reload()
		});

		const complainGrid = new gridjs.Grid({
			search: true,
			pagination: {
				limit: 5,
				summary: false
			},
			sort: true,
			fixedHeader: true,
			columns: [
				{
					id: "id",
					name: "ID",
					width: '5%',
					formatter: (cell, row) => {
						cell = `<span class="text-indigo-600 font-semibold">${cell}</span>`;
						return gridjs.html(cell);
					},
					hidden: true
				},
				"Date",
				"Complain",
				"Complain For",
				{
					name: "Status",
					formatter: (cell, row) => {
						if (cell) {
							cell = `<span class="text-white font-semibold bg-green-500 py-1 px-3 rounded-full">Resolved</span>`;
						} else {
							cell = `<span class="text-white font-semibold bg-red-500 py-1 px-3 rounded-full">Pending</span>`
						}
						return gridjs.html(cell);
					}
				}
			],
			server: {
				url: '/student/getStudentComplaints/',
				then: data => {
					if (data.status === "success") {
						return data["data"].map(complaint => [complaint.id, complaint.date, complaint.title, complaint.compalainFor, complaint.status]);
					} else {
						document.querySelector(".gridjs-tbody").innerHTML = `
                                   <tr class="gridjs-tr"><td role="alert" colspan="4" class="gridjs-td gridjs-message gridjs-error">No Data Found</td></tr>
                              `;
                              return [];
					}
				}
			},
			className: {
				th: '!bg-black !text-white',
				sort: '!bg-black !text-white',
				search: '!float-right !w-[25%]',
			}
		})

		complainGrid.render(document.getElementById("wrapper"))

		document.querySelector(".gridjs-search-input").placeholder = "Search...";

		complainGrid.on('cellClick', (...args) => {
			console.log(args);
			if (args[2]["id"] === "complain") {
				complaintId = args[3]["_cells"][0]["data"];
				fetchComplaintData(`/student/getStudentComplaints/?complainId=${complaintId}`, "Complaint Details", false, true);
				document.getElementById('view-complain-modal').classList.remove('scale-0', 'opacity-0');
				document.getElementById('view-complain-modal').classList.add('scale-100', 'opacity-100');
			}
		});

		function fetchComplaintData(apiUrl, headingText, isBtnsVisible, isMakeInputReadOnly) {
			fetch(apiUrl)
				.then(response => response.json())
				.then(data => {
					console.log(data);
					if (data.status === "success") {
						updateComplaintModal(data);
					}
					document.getElementById("complain-model-heading").innerText = headingText;
					document.getElementById("btns-container").style.display = isBtnsVisible ? "flex" : "none";
					isMakeInputReadOnly ? makeInputReadOnly() : makeInputEditable();
				});
		}

		function updateComplaintModal(data) {
			const complaint = data.data;
			
			// Update status badge
			const statusBadge = document.getElementById('complaint-status');
			if (complaint.status) {
				statusBadge.className = 'px-4 py-1.5 rounded-full text-sm font-semibold bg-green-100 text-green-800';
				statusBadge.textContent = 'Resolved';
			} else {
				statusBadge.className = 'px-4 py-1.5 rounded-full text-sm font-semibold bg-yellow-100 text-yellow-800';
				statusBadge.textContent = 'Pending';
			}

			// Update basic details
			document.getElementById('complaint-title').textContent = complaint.title;
			document.getElementById('complaint-date').textContent = complaint.date;
			document.getElementById('complaint-description').textContent = complaint.description;

			// Handle resolution details
			const resolutionDetails = document.getElementById('resolution-details');
			if (complaint.status && complaint.actionTaken) {
				resolutionDetails.classList.remove('hidden');
				document.getElementById('action-taken').textContent = complaint.actionTaken;
				document.getElementById('resolved-by').textContent = complaint.resolvedBy || 'N/A';
				document.getElementById('resolved-date').textContent = complaint.resolvedDate || 'N/A';
			} else {
				resolutionDetails.classList.add('hidden');
			}
		}

		function makeInputReadOnly() {
			document.getElementById('add-complain-modal').querySelectorAll('input').forEach(input => {
				input.classList.remove('focus:outline-2', 'focus:-outline-offset-2', 'focus:outline-indigo-600');
				input.setAttribute('readonly', true);
				input.setAttribute('disabled', true);
				input.removeAttribute('required');
			})
		}

		function makeInputEditable() {
			document.getElementById('add-complain-modal').querySelectorAll('input').forEach(input => {
				input.classList.add('focus:outline-2', 'focus:-outline-offset-2', 'focus:outline-indigo-600');
				input.removeAttribute('readonly');
				input.removeAttribute('disabled');
				input.setAttribute('required', true);
			})
		}
	</script>
</body>

</html>
